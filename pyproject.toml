[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-health-checker"
version = "1.0.0"
description = "Check a list of network devices (ping + TCP ports) or sweep a subnet, with CSV and HTML reports."
readme = "README.md"
license = "MIT"
authors = [{ name = "Manoj Kandel" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
netcheck = "netcheck.cli:main"

[tool.setuptools]
packages = ["netcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` keeps code within line-length; long lines left are CSS/HTML inside strings.
ignore = ["E501"]
